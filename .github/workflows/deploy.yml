name: CI and Deploy Frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block tracked secret files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.local$|\.pem$|id_rsa|\.key$|\.gnmap$'; then
            echo "Secret files must not be committed"
            exit 1
          fi
          echo "No secret files tracked"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Malware pattern scan
        run: |
          PATTERNS='global\.i=|_0x[0-9a-f]{4,}|createRequire\(import\.meta|child_process|drpc\.org|blockscout|eval\(|new Function'
          if grep -rnE "$PATTERNS" --include='*.js' --include='*.cjs' --include='*.mjs' --include='*.jsx' src index.html vite.config.js tailwind.config.js postcss.config.js; then
            echo "Suspicious patterns found"
            exit 1
          fi
          echo "No suspicious patterns found"

      - name: Config size guard
        run: test "$(wc -c < tailwind.config.js)" -lt 2000

      - name: npm audit
        run: npm audit --audit-level=critical
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.sales.rw
      - name: Upload dist
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 3

  deploy:
    name: Deploy to sales.rw
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      # Upload next to the live site, so visitors never see a half-copied site.
      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: "dist/*"
          target: "/var/www/sales.rw.next"
          strip_components: 1
          rm: true

      - name: Switch to the new version
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            test -s /var/www/sales.rw.next/index.html
            chown -R www-data:www-data /var/www/sales.rw.next
            find /var/www/sales.rw.next -type d -exec chmod 755 {} \;
            find /var/www/sales.rw.next -type f -exec chmod 644 {} \;
            rm -rf /var/www/sales.rw.previous
            if [ -d /var/www/sales.rw ]; then mv /var/www/sales.rw /var/www/sales.rw.previous; fi
            mv /var/www/sales.rw.next /var/www/sales.rw
            if ! nginx -t; then
              echo "nginx config is invalid, going back"
              rm -rf /var/www/sales.rw
              mv /var/www/sales.rw.previous /var/www/sales.rw
              exit 1
            fi
            systemctl reload nginx
            echo "Frontend deployed to https://sales.rw (previous version kept in /var/www/sales.rw.previous)"
