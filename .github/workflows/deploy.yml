name: CI and Deploy Frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Malware pattern scan
        run: |
          set -e
          PATTERNS='global\.i=|_0x[0-9a-f]{4,}|createRequire\(import\.meta|child_process|drpc\.org|blockscout|eval\(|new Function'
          if rg -n "$PATTERNS" --glob '*.js' --glob '*.cjs' --glob '*.mjs' --glob '*.jsx' --glob '!node_modules' --glob '!dist' .; then
            echo "Suspicious patterns found"
            exit 1
          fi
          echo "No suspicious patterns found"

      - name: Config size guard
        run: |
          size=$(wc -c < tailwind.config.js)
          echo "tailwind.config.js size: $size bytes"
          test "$size" -lt 2000

      - name: npm audit
        run: npm audit --audit-level=critical
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  build:
    name: Build
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.sales.rw
          VITE_ENCRYPTION_KEY: ${{ secrets.VITE_ENCRYPTION_KEY }}

      - name: Upload dist artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 3

  deploy:
    name: Deploy to sales.rw
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: "dist/*"
          target: "/var/www/sales.rw"
          strip_components: 1
          rm: true

      - name: Fix permissions and reload nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            chown -R www-data:www-data /var/www/sales.rw
            find /var/www/sales.rw -type d -exec chmod 755 {} \;
            find /var/www/sales.rw -type f -exec chmod 644 {} \;
            nginx -t
            systemctl reload nginx
            echo "Frontend deployed to https://www.sales.rw"
